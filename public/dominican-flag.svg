<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <clipPath id="shield-clip">
      <path d="M 282 178 Q 282 205 300 216 Q 318 205 318 178 Z" />
    </clipPath>
  </defs>

  <!-- Blue and Red Quarters -->
  <!-- Top Left: Ultramarine Blue -->
  <rect x="0" y="0" width="260" height="160" fill="#002B7F" />
  <!-- Top Right: Vermilion Red -->
  <rect x="340" y="0" width="260" height="160" fill="#CE1126" />
  <!-- Bottom Left: Vermilion Red -->
  <rect x="0" y="240" width="260" height="160" fill="#CE1126" />
  <!-- Bottom Right: Ultramarine Blue -->
  <rect x="340" y="240" width="260" height="160" fill="#002B7F" />

  <!-- White Cross -->
  <rect x="0" y="160" width="600" height="80" fill="#FFFFFF" />
  <rect x="260" y="0" width="80" height="400" fill="#FFFFFF" />

  <!-- Center Coat of Arms (Escudo Nacional de la República Dominicana) -->
  <g transform="translate(0, 0)">
    <!-- Upper Ribbon: DIOS PATRIA LIBERTAD (Blue) -->
    <path d="M 276 166 Q 300 160 324 166 Q 320 171 315 169 Q 300 166 285 169 Q 280 171 276 166 Z" fill="#002B7F" />
    <path d="M 280 166 Q 300 162 320 166" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1 1" opacity="0.8" />

    <!-- Branches: Laurel (left) and Palm (right) -->
    <!-- Left Laurel Branch (Olive green) -->
    <path d="M 275 180 C 270 190 273 205 285 218 C 282 212 278 198 279 185 Z" fill="#157347" />
    <ellipse cx="272" cy="186" rx="3" ry="5" transform="rotate(-30 272 186)" fill="#2e7d32" />
    <ellipse cx="271" cy="196" rx="3" ry="5" transform="rotate(-15 271 196)" fill="#388e3c" />
    <ellipse cx="276" cy="207" rx="3" ry="5" transform="rotate(15 276 207)" fill="#2e7d32" />

    <!-- Right Palm Branch (Green) -->
    <path d="M 325 180 C 330 190 327 205 315 218 C 318 212 322 198 321 185 Z" fill="#157347" />
    <ellipse cx="328" cy="186" rx="3" ry="5" transform="rotate(30 328 186)" fill="#2e7d32" />
    <ellipse cx="329" cy="196" rx="3" ry="5" transform="rotate(15 329 196)" fill="#388e3c" />
    <ellipse cx="324" cy="207" rx="3" ry="5" transform="rotate(-15 324 207)" fill="#2e7d32" />

    <!-- Center Shield -->
    <g clip-path="url(#shield-clip)">
      <rect x="282" y="174" width="18" height="20" fill="#002B7F" />
      <rect x="300" y="174" width="18" height="20" fill="#CE1126" />
      <rect x="282" y="194" width="18" height="24" fill="#CE1126" />
      <rect x="300" y="194" width="18" height="24" fill="#002B7F" />
      <!-- White cross in shield -->
      <rect x="282" y="191" width="36" height="6" fill="#FFFFFF" />
      <rect x="297" y="174" width="6" height="44" fill="#FFFFFF" />
    </g>
    <!-- Shield Border -->
    <path d="M 282 178 Q 282 205 300 216 Q 318 205 318 178 Z" fill="none" stroke="#FFD700" stroke-width="1.8" />

    <!-- Open Bible and Golden Cross in center of shield -->
    <!-- Mini Spear / Flag trophies behind bible -->
    <line x1="288" y1="184" x2="312" y2="204" stroke="#FFD700" stroke-width="1.2" />
    <line x1="312" y1="184" x2="288" y2="204" stroke="#FFD700" stroke-width="1.2" />
    <line x1="292" y1="180" x2="308" y2="208" stroke="#FFFFFF" stroke-width="0.8" />
    <line x1="308" y1="180" x2="292" y2="208" stroke="#FFFFFF" stroke-width="0.8" />

    <!-- Open Bible Pages -->
    <path d="M 293 192 Q 297 190 300 192 Q 303 190 307 192 L 307 200 Q 303 198 300 200 Q 297 198 293 200 Z" fill="#FFFDF0" stroke="#443" stroke-width="0.6" />
    <line x1="300" y1="192" x2="300" y2="200" stroke="#888" stroke-width="0.5" />
    <!-- Small Golden Cross above the Bible -->
    <line x1="300" y1="185" x2="300" y2="191" stroke="#FFD700" stroke-width="1.4" stroke-linecap="round" />
    <line x1="297.5" y1="187.5" x2="302.5" y2="187.5" stroke="#FFD700" stroke-width="1.4" stroke-linecap="round" />

    <!-- Lower Ribbon: REPUBLICA DOMINICANA (Vermilion Red) -->
    <path d="M 274 220 Q 300 227 326 220 Q 321 216 317 218 Q 300 223 283 218 Q 279 216 274 220 Z" fill="#CE1126" />
    <path d="M 278 220 Q 300 225 322 220" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1 1" opacity="0.8" />
  </g>
</svg>
